<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FF6B35" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="YoungJump" />
<title>YoungJump · 本地漫画阅读器</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header class="topbar" id="topbar">
      <div class="topbar-title" id="topbar-title">书架</div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <!-- 页面容器 -->
    <main class="page-container" id="page-container"></main>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab-item active" data-tab="shelf">
        <svg viewBox="0 0 24 24" class="tab-icon"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
        <span>书架</span>
      </button>
      <button class="tab-item" data-tab="search">
        <svg viewBox="0 0 24 24" class="tab-icon"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        <span>搜索</span>
      </button>
      <button class="tab-item" data-tab="mine">
        <svg viewBox="0 0 24 24" class="tab-icon"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <!-- 浮层容器 -->
  <div id="overlay"></div>
  <div id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
